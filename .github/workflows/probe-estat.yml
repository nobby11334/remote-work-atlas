name: Probe original migration Excel
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_estat.py"
      - ".github/workflows/probe-estat.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/probe_estat.py
