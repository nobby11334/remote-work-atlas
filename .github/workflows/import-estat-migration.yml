name: Refresh official prefecture youth migration
on:
  schedule:
    - cron: "50 2 6 * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/import_estat_migration.py"
      - ".github/workflows/import-estat-migration.yml"
permissions:
  contents: write
concurrency:
  group: official-pref-migration
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse official 2025 annual age-and-sex Excel
        run: python3 scripts/import_estat_migration.py
      - name: Validate all published data
        run: python3 scripts/validate_data.py
      - name: Commit when official Excel changed
        run: |
          if ! git diff --quiet -- data/prefecture_youth_migration_2025.json || [ -n "$(git ls-files --others --exclude-standard data/prefecture_youth_migration_2025.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prefecture_youth_migration_2025.json
            git commit -m "data: import official prefecture 20s gender net migration"
            git push
          else
            echo "Official source unchanged"
          fi
