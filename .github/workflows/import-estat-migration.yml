name: Refresh official prefecture youth migration
on:
  schedule:
    - cron: "50 2 6 * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/import_estat_migration.py"
      - "scripts/import_estat_migration_2024.py"
      - "scripts/build_migration_csv.py"
      - ".github/workflows/import-estat-migration.yml"
permissions:
  contents: write
concurrency:
  group: official-pref-migration
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse official 2024 and 2025 annual age-and-sex Excels
        run: |
          python3 scripts/import_estat_migration_2024.py
          python3 scripts/import_estat_migration.py
      - name: Export standardized two-year CSV
        run: python3 scripts/build_migration_csv.py
      - name: Validate all published data
        run: python3 scripts/validate_data.py
      - name: Commit when official Excel changed
        run: |
          if ! git diff --quiet -- data/prefecture_youth_migration_202*.json data/prefecture_youth_migration_2024_2025.csv || [ -n "$(git ls-files --others --exclude-standard data/prefecture_youth_migration_202*.json data/prefecture_youth_migration_2024_2025.csv)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prefecture_youth_migration_202*.json data/prefecture_youth_migration_2024_2025.csv
            git commit -m "data: import official prefecture 20s gender net migration"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push; then exit 0; fi
              sleep 3
            done
            exit 1
          else
            echo "Official source unchanged"
          fi
